; PlatformIO Project Configuration File
; Launcher for ST7789 240x320 + Encoder JY050 + Touch (Same pinout as Repo 1)

[env:Launcher-ST7789-Encoder]
board = esp32-s3-devkitc-1
board_build.partitions = custom_4Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/Launcher-ST7789-Encoder>
build_flags =
	${env.build_flags}
	${env_light.build_flags}
	-Iboards/Launcher-ST7789-Encoder
	-DBOARD_NAME=\"Launcher-ST7789-Encoder\"
	-DLITE_VERSION=1
	-DHAS_ENCODER_JY050=1
	-DENCODER_CLK=12
	-DENCODER_DT=13
	-DENCODER_SW=14
	-DENCODER_UP=20
	-DENCODER_DOWN=19
	-DHAS_TOUCH=1
	-DHAS_SCREEN=1
	-DROTATION=1
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=1
	-DTFT_BL=4
	-DTFT_RST=15
	-DTFT_DC=7
	-DTFT_MOSI=6
	-DTFT_SCLK=5
	-DTFT_CS=16
	-DTOUCH_CS=11
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSDCARD_CS=40
	-DSDCARD_SCK=5
	-DSDCARD_MISO=41
	-DSDCARD_MOSI=6
	-DGROVE_SDA=18
	-DGROVE_SCL=8
	-DMINBRIGHT=160

lib_deps =
	${env_light.lib_deps}
